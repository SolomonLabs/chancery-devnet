[workspace]
members                    = ["programs/chancery", "programs/faucet", "xtask"]
resolver                   = "2"

[workspace.dependencies]
bytemuck                   = { version = "1.19", features = ["derive"] }
borsh                      = { version = "1.5", features = ["derive"] }
thiserror                  = "1.0"
solana-account-info        = "3"
solana-cpi                 = "3"
solana-clock               = "3"
solana-instruction         = "3"
solana-pubkey              = { version = "3", features = ["bytemuck", "borsh", "curve25519", "sha2"] }
solana-msg                 = "3"
solana-program-entrypoint  = "3"
solana-program-error       = "3"
solana-rent                = "3"
solana-sha256-hasher       = "3"
solana-keccak-hasher       = "3"
solana-secp256k1-recover   = "3"
solana-system-interface    = { version = "2", features = ["bincode"] }
solana-sysvar              = "3"
syn                        = { version = "2.0", features = ["full", "visit"] }

[profile.release]
codegen-units              = 1
lto                        = "thin"
overflow-checks            = true

[profile.dev]
overflow-checks            = true

[profile.release.build-override]
opt-level                  = 3
incremental                = false
codegen-units              = 1
